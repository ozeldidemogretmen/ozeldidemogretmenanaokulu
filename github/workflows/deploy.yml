# Cloudflare Pages — GitHub deposundan otomatik yayın
# Bu dosya GitHub Pages için yedek yayınlar.
# Asıl önerilen yol: Cloudflare Dashboard > Pages > GitHub bağlantısı.

name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Placeholder
        run: echo "Cloudflare Pages kullanın. Bu iş akışı kasıtlı olarak kapalı."
